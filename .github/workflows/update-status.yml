name: Auto Update Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write current time to status.txt
        run: |
          echo "Last update: $(TZ=Asia/Colombo date)" > status.txt
          echo "Status: GitHub Actions is running automatically" >> status.txt

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add status.txt
          git commit -m "Auto update status" || echo "No changes to commit"
          git push
